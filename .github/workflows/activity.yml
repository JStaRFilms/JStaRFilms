name: Refresh public activity
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'JStaRFilms/JStaRFilms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public activity and generate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/activity.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/activity.json assets/activity-*.svg ACTIVITY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh public activity snapshot'
          git push
